# qBittorrent WebUI：设置 > WebUI 中的监听地址/端口，以及验证用户名、密码
qbittorrent:
  host: localhost
  port: 8080
  username: admin
  password: admin
# 自动标签。字段说明见 README「自动标签」。
# 通用: prefix / max_number / ignore / when
# 限定: team.special、format.multi_tag、producer.patterns
auto_tags:
  media:                # Movie, TV, Music, XXX, Ebook, Audiobook, Manga
    prefix: '#'
  source:               # BluRay, WEB-DL, WEBRip, DVD, HDTV, HDDVD, HDRip
    prefix: '$'
    when: [Movie, TV]
  resolution:           # 720p/i, 1080p/i, 2160p/i, 480p, mHD
    when: [Movie, TV]
  team:                 # 压制组
    prefix: '-'
    max_number: 2
    special:            # 含 - 或 []、不能按最后一个 '-' 切开的组名，优先整段匹配
      - de[42]
      - D-Z0N3
    when: [Movie, TV]
  process:              # Encode, Raw, Remux
    prefix: '~'
    ignore: true
    when: [Movie, TV]
  codec:                # 种子名中的视频编码（x264、H.265 等）
    ignore: true
    when: [Movie, TV]
  format:               # 内容文件后缀（FLAC、EPUB、CBZ 等）
    ignore: true
    when: [Music, Audiobook, Ebook, Manga]
    # multi_tag: true   # 每个够格后缀各打一个；省略为 false
  year:                 # 作品年份
    max_number: 3
    ignore: true
    when: [Movie, TV]
  producer:
    prefix: '*'
    when: [XXX]
    patterns:           # 从上到下第一条命中则 media=XXX 且打该 producer；ignore 时不识别 XXX
      - FC2: 'fc2[ -]?(ppv[ -])?\d+'
      - JAV: '[a-zA-Z]+-\d+'
# 手动添加的 tag，运行 qtag 时不会被自动移除
manual_tags:
  - ★Save
  - ★Post
# 定义各个 tracker 的特性
# url_key: tracker announce URL 中的关键词
# ignore: true 则跳过该 tracker；省略或 false = 处理
# media 为空时按 Movie/TV 片名规则识别；['Music'] 固定打 Music；
# ['Ebook', 'Audiobook', 'Manga'] 按种子内文件扩展名识别（同时出现时优先 Audiobook，其次 Manga）
trackers:
  NHD:
    url_key: nexushd
    media:
  PuTao:
    url_key: sjtu
    media:
  MT:
    url_key: m-team
    media:
      - Movie
      - TV
      - Music
      - XXX
  OpenCD:
    url_key: open.cd
    media:
      - Music
  MAM:
    url_key: myanonamouse
    media:
      - Ebook
      - Audiobook
      - Manga
