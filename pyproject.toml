[project]
name = "qtag"
version = "0.2.0"
description = "Auto-tag torrents in qBittorrent by name, tracker, or file type."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "platformdirs",
    "PyYAML",
    "qbittorrent-api",
]

[project.scripts]
qtag = "qtag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.force-include]
"src/qtag/default_config.yaml" = "qtag/default_config.yaml"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
